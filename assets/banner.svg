<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Text.js Showcase — React in the console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07080E"/>
      <stop offset="0.55" stop-color="#0A0C14"/>
      <stop offset="1" stop-color="#0D0A14"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 40) rotate(45) scale(460)">
      <stop stop-color="#FF4D8D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1140 380) rotate(-135) scale(520)">
      <stop stop-color="#3291FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3291FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="72" y1="180" x2="620" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4D8D"/>
      <stop offset="0.5" stop-color="#C472FB"/>
      <stop offset="1" stop-color="#3291FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="72" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4D8D" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FF4D8D"/>
      <stop offset="0.5" stop-color="#C472FB"/>
      <stop offset="0.8" stop-color="#3291FF"/>
      <stop offset="1" stop-color="#3291FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="cells" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="736" y="58" width="472" height="304" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#cells)"/>
  <rect width="1280" height="420" fill="url(#glowPink)"/>
  <rect width="1280" height="420" fill="url(#glowBlue)"/>

  <!-- brand -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="66" fill="#FF4D8D" font-size="18" font-weight="700">▼</text>
    <text x="96" y="66" fill="#EDEDED" font-size="17" font-weight="700" letter-spacing="2">TEXT.JS</text>
    <rect x="190" y="48" width="104" height="26" rx="13" stroke="#2A2E3A" fill="#FFFFFF" fill-opacity="0.02"/>
    <text x="206" y="65" fill="#8A8F98" font-size="11" letter-spacing="2.2">SHOWCASE</text>
  </g>

  <!-- headline -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="164" fill="#EDEDED" font-size="58" font-weight="700" letter-spacing="-2">React in the</text>
    <text x="72" y="226" fill="url(#headline)" font-size="58" font-weight="700" letter-spacing="-2">console.</text>
    <text x="72" y="270" fill="#8A8F98" font-size="15">Layout, data, charts, forms and keyboard-first UI —</text>
    <text x="72" y="292" fill="#8A8F98" font-size="15">rendered entirely inside <tspan fill="#EDEDED">console.log</tspan>.</text>
  </g>

  <!-- keycaps -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <g transform="translate(72 324)">
      <rect width="58" height="28" rx="7" fill="#141720" stroke="#2A2E3A"/>
      <text x="29" y="18" fill="#C472FB" text-anchor="middle" font-weight="700">1–6</text>
      <text x="70" y="18" fill="#6F7480">pages</text>
    </g>
    <g transform="translate(194 324)">
      <rect width="52" height="28" rx="7" fill="#141720" stroke="#2A2E3A"/>
      <text x="26" y="18" fill="#C472FB" text-anchor="middle" font-weight="700">⌘K</text>
      <text x="64" y="18" fill="#6F7480">commands</text>
    </g>
    <g transform="translate(326 324)">
      <rect width="28" height="28" rx="7" fill="#141720" stroke="#2A2E3A"/>
      <text x="14" y="18" fill="#C472FB" text-anchor="middle" font-weight="700">?</text>
      <text x="40" y="18" fill="#6F7480">keys</text>
    </g>
    <g transform="translate(412 324)">
      <rect width="28" height="28" rx="7" fill="#141720" stroke="#2A2E3A"/>
      <text x="14" y="18" fill="#C472FB" text-anchor="middle" font-weight="700">t</text>
      <text x="40" y="18" fill="#6F7480">theme</text>
    </g>
    <text x="72" y="382" fill="#4F5460" font-size="10" letter-spacing="1.4">REACT 19 · TEXT.JS 1.6 · BUN · DEVTOOLS</text>
  </g>

  <!-- console card -->
  <g filter="url(#shadow)">
    <rect x="736" y="58" width="472" height="304" rx="16" fill="#0B0D14" stroke="#2A2E3A"/>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="736" y="58" width="472" height="34" fill="#11141D"/>
    <circle cx="760" cy="75" r="5" fill="#FF5F57"/>
    <circle cx="778" cy="75" r="5" fill="#FEBC2E"/>
    <circle cx="796" cy="75" r="5" fill="#28C840"/>
    <text x="816" y="79" fill="#6F7480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">DEVTOOLS · CONSOLE</text>
    <text x="1172" y="79" fill="#3E4350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">116×34</text>

    <!-- mini frame -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="760" y="120" fill="#FF4D8D" font-size="10" font-weight="700">▼ TEXT.JS</text>
      <text x="824" y="120" fill="#5B606C" font-size="10">SHOWCASE</text>
      <text x="1180" y="120" fill="#8A8F98" font-size="10" text-anchor="end">1 2 3 4 5 6</text>

      <text x="760" y="158" fill="#EDEDED" font-size="30" font-weight="700" letter-spacing="-1">TEXT.JS</text>
      <text x="896" y="153" fill="url(#headline)" font-size="10" font-weight="700">REACT IN YOUR CONSOLE</text>
      <text x="896" y="167" fill="#5B606C" font-size="10">React 19 → Yoga → CellBuffer</text>

      <!-- live panel -->
      <rect x="760" y="184" width="252" height="92" rx="7" fill="#0F121A" stroke="#262A35"/>
      <text x="772" y="200" fill="#4F5460" font-size="8" letter-spacing="1">LIVE STATE</text>
      <text x="772" y="234" fill="#3291FF" font-size="28" font-weight="700" letter-spacing="1">007</text>
      <text x="772" y="250" fill="#5B606C" font-size="8">FRAMES RENDERED</text>
      <text x="856" y="203" fill="#8A8F98" font-size="8">Every change is one</text>
      <text x="856" y="214" fill="#EDEDED" font-size="8">console.log call.</text>
      <text x="856" y="232" fill="#4F5460" font-size="8">loop</text>
      <rect x="880" y="226" width="118" height="7" rx="3.5" fill="#20242F"/>
      <rect x="880" y="226" width="82" height="7" rx="3.5" fill="#3291FF"/>
      <text x="856" y="252" fill="#5B606C" font-size="8">count = 7  ·  ↑ ↓  ·  r reset</text>
      <text x="772" y="266" fill="#3E4350" font-size="8">console.log("%c▀▀▀", "#3291ff")</text>

      <!-- telemetry panel -->
      <rect x="1024" y="184" width="160" height="92" rx="7" fill="#0F121A" stroke="#262A35"/>
      <text x="1036" y="200" fill="#4F5460" font-size="8" letter-spacing="1">TURBOLOG</text>
      <polyline points="1036,236 1046,230 1056,233 1066,222 1076,225 1086,214 1096,218 1106,208 1116,212 1126,203 1136,207 1146,200 1156,204 1166,198"
        stroke="#7FD88F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1036" y="252" fill="#5B606C" font-size="8">frame 27</text>
      <text x="1110" y="252" fill="#5B606C" font-size="8">fps 15.0</text>
      <text x="1036" y="266" fill="#5B606C" font-size="8">spans 149</text>
      <text x="1110" y="266" fill="#7FD88F" font-size="8">0 idle calls</text>

      <!-- table strip -->
      <text x="760" y="298" fill="#3E4350" font-size="8">› dpl_a1f9   ● ready   console-web   feat: live frame‥</text>
      <text x="760" y="312" fill="#3E4350" font-size="8">  dpl_b2e7   ● build   frame-player  perf: skip rows‥</text>
      <text x="760" y="326" fill="#3E4350" font-size="8">  dpl_c3d5   ● ready   docs-site     docs: sequences‥</text>
      <rect x="760" y="334" width="424" height="1" fill="#1A1E28"/>
      <text x="760" y="350" fill="#FF4D8D" font-size="9">▼</text>
      <text x="776" y="350" fill="#4F5460" font-size="9">click the page, then press ↑ ↓ · ⌘K · ?</text>
    </g>
  </g>

  <rect x="72" y="400" width="1136" height="2" fill="url(#rule)"/>
</svg>
